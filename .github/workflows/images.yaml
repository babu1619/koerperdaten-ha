# Optional: baut fertige Images für Home Assistant, damit der Green bei Updates nur noch herunterlädt.
# Aktiv erst, wenn in koerperdaten/config.yaml die Zeile "image:" eingeschaltet ist (siehe ANLEITUNG-GITHUB.md).
name: Images bauen

on:
  push:
    branches: [main]
    paths: [koerperdaten/**]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  info:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.c.outputs.image }}
      version: ${{ steps.c.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import yaml
          c = yaml.safe_load(open("koerperdaten/config.yaml", encoding="utf-8"))
          print("image=" + str(c.get("image") or "").lower())
          print("version=" + str(c["version"]))
          PY
      - if: steps.c.outputs.image == ''
        run: echo "::notice::Keine image-Zeile in config.yaml – Home Assistant baut die App selbst. Nichts zu tun."

  bauen:
    needs: info
    if: needs.info.outputs.image != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: n
        run: |
          IMAGE='${{ needs.info.outputs.image }}'
          echo "name=${IMAGE//\{arch\}/${{ matrix.arch }}}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: koerperdaten
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ steps.n.outputs.name }}:${{ needs.info.outputs.version }}
            ${{ steps.n.outputs.name }}:latest
          build-args: |
            BUILD_VERSION=${{ needs.info.outputs.version }}
            BUILD_ARCH=${{ matrix.arch }}
          labels: |
            io.hass.name=Körperdaten-Server
            io.hass.type=addon
            io.hass.version=${{ needs.info.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
